services:
  twitter-to-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitter-to-pdf
    restart: always
    ports:
      # 绑定至 127.0.0.1，避免公网直通，默认端口配置为 3032
      - "127.0.0.1:${APP_PORT:-3032}:3032"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3032
      - HOSTNAME=0.0.0.0
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3032/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
