# Nginx configuration for Twitter/X to PDF (Next.js)
# 绑定域名：x2pdf.alonglfb.com / xtopdf.alonglfb.com
# 转发后端：127.0.0.1:3032

upstream nextjs_upstream {
    server 127.0.0.1:3032;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name x2pdf.alonglfb.com xtopdf.alonglfb.com;

    # ACME challenge support
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name x2pdf.alonglfb.com xtopdf.alonglfb.com;

    ssl_certificate /etc/nginx/ssl/*.alonglfb.com_alonglfb.com_EC256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/*.alonglfb.com_alonglfb.com_EC256/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 25M;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Next.js 静态资源深度缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 公共静态资源 (favicon, 图标等)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 核心前端 Next.js 页面反代
    location / {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
